name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Create GitHub release
        type: boolean
        default: false
      tag:
        description: Release tag (empty = v<run number>)
        type: string
        default: ""
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Licenses and Install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create .env.example if missing
        run: |
          if [ ! -f ".env.example" ]; then
            touch .env.example
          fi
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Patch build.gradle.kts
        run: |
          python3 - <<'EOF'
          import re
          with open('app/build.gradle.kts', 'r') as f:
              content = f.read()
          new_debug = '''debug {
              isCrunchPngs = true
              isMinifyEnabled = true
              isShrinkResources = true
              proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
          }'''
          content = re.sub(r'debug\s*\{[^}]*\}', new_debug, content)
          with open('app/build.gradle.kts', 'w') as f:
              f.write(content)
          EOF

      - name: Ensure proguard-rules.pro exists
        run: touch app/proguard-rules.pro

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          cp "$apk" "${REPO_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.event.repository.name }}.apk
          archive: false

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          TAG="${INPUT_TAG:-v${{ github.run_number }}}"
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${REPO_NAME}.apk" --clobber
          else
            gh release create "$TAG" "${REPO_NAME}.apk" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          fi
